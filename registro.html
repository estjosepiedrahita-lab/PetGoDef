<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta · PetGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>

<div class="auth">
  <section class="auth-art">
    <div class="photo" data-img="assets/img/auth.jpg"><span class="e">🐕</span><span class="c">Foto: Golden Retriever feliz</span></div>
    <h2>Regístrate gratis y cuida a tu mascota</h2>
    <p>Paseos y baños con profesionales verificados en Bogotá.</p>
  </section>
  <section class="auth-form"><div class="auth-col">
    <a class="logo" href="index.html"><span class="paw">🐾</span><span class="name">PetGo</span></a>
    <h1>Crea tu cuenta</h1>
    <p class="sub">Completa tus datos para empezar</p>
    <div class="field"><label for="r-nombre">Nombre</label><input id="r-nombre" type="text" placeholder="Tu nombre completo" autocomplete="name"><span class="msg"></span></div>
    <div class="field"><label for="r-correo">Correo</label><input id="r-correo" type="email" placeholder="tu@correo.com" autocomplete="email"><span class="msg"></span></div>
    <div class="field"><label for="r-pass">Contraseña</label><input id="r-pass" type="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password"><span class="msg"></span></div>
    <div class="field"><label for="r-pass2">Confirmar contraseña</label><input id="r-pass2" type="password" placeholder="Repite tu contraseña" autocomplete="new-password"><span class="msg"></span></div>
    <a class="btn block" id="btn-register" href="estado-usuario-nuevo.html">Crear cuenta</a>
    <div class="auth-alt"><span>¿Ya tienes cuenta?</span><a href="login.html">Inicia sesión</a></div>
  </div></section>
</div>
</main>

<script src="js/app.js"></script>
</body>
</html>
