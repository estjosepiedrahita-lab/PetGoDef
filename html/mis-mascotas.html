<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis mascotas · PetGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="navbar"><div class="navbar-in">
  <a class="logo" href="dashboard.html"><span class="paw">🐾</span><span class="name">PetGo</span></a>
  <nav class="nav-links" aria-label="Principal"><a class="nav-link" href="dashboard.html">Inicio</a><a class="nav-link" href="servicios.html">Servicios</a><a class="nav-link" href="mis-reservas.html">Mis reservas</a><a class="nav-link active" href="mis-mascotas.html">Mis mascotas</a></nav>
  <div class="nav-actions">
    <a class="bell" href="notificaciones.html" aria-label="Notificaciones">🔔<span class="count">2</span></a>
    <a class="profile-pill" href="perfil.html"><span class="avatar js-initial">A</span><span class="js-name">Aiko</span></a>
  </div>
</div></header>
<main>

<div class="page">
  <div class="head-row">
    <div class="title-block"><h1 class="h1">Mis mascotas</h1><p class="sub">Gestiona los perfiles de tus mascotas</p></div>
    <a class="btn sm" id="btn-add" href="#pet-form">+ Agregar mascota</a>
  </div>
  <div class="pets-cols">
    <div class="pet-list" id="pet-list">
      <div class="pet-row"><div class="card"><div class="icon-box">🐕</div><div class="dt"><b>Max</b><span>Golden Retriever · 3 años</span></div></div><button type="button" class="btn danger sm js-del">Eliminar</button></div>
      <div class="pet-row"><div class="card"><div class="icon-box">🐩</div><div class="dt"><b>Luna</b><span>Poodle · 2 años</span></div></div><button type="button" class="btn danger sm js-del">Eliminar</button></div>
    </div>
    <form class="card pet-form" id="pet-form" novalidate>
      <div class="tt">Agregar mascota</div>
      <div class="field"><label for="f-nombre">Nombre</label><input id="f-nombre" type="text" placeholder="Ej: Max" autocomplete="off"><span class="msg">Completa este campo.</span></div>
      <label class="upload"><span class="ic">📷</span><span class="tx" id="foto-tx">Subir foto</span><input id="f-foto" type="file" accept="image/*"></label>
      <div class="field"><label for="f-especie">Especie</label><input id="f-especie" type="text" placeholder="Perro" autocomplete="off"></div>
      <div class="field"><label for="f-raza">Raza</label><input id="f-raza" type="text" placeholder="Ej: Labrador" autocomplete="off"></div>
      <div class="field"><label for="f-edad">Edad</label><input id="f-edad" type="text" placeholder="Ej: 3 años" autocomplete="off"></div>
      <button type="submit" class="btn block" id="save-pet">Guardar mascota</button>
    </form>
  </div>
</div>
</main>

<script src="js/app.js"></script>
</body>
</html>
