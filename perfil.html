<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil · PetGo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="navbar"><div class="navbar-in">
  <a class="logo" href="dashboard.html"><span class="paw">🐾</span><span class="name">PetGo</span></a>
  <nav class="nav-links" aria-label="Principal"><a class="nav-link" href="dashboard.html">Inicio</a><a class="nav-link" href="servicios.html">Servicios</a><a class="nav-link" href="mis-reservas.html">Mis reservas</a><a class="nav-link" href="mis-mascotas.html">Mis mascotas</a></nav>
  <div class="nav-actions">
    <a class="bell" href="notificaciones.html" aria-label="Notificaciones">🔔<span class="count">2</span></a>
    <a class="profile-pill" href="perfil.html"><span class="avatar js-initial">A</span><span class="js-name">Aiko</span></a>
  </div>
</div></header>
<main>

<div class="col w560 gap16">
  <div class="flash" id="flash">✅ ¡Perfil actualizado correctamente!</div>
  <div class="card profile-card">
    <span class="avatar l" id="v-inicial">A</span>
    <div class="info"><div class="nm" id="v-nombre">Aiko</div><div class="li" id="v-correo">demo@petgo.com</div><div class="li" id="v-tel">+57 300 123 4567</div><div class="li">📍 <span id="v-ciudad">Bogotá</span></div></div>
  </div>
  <div class="card edit-card" id="edit-card">
    <div class="tt">Editar información personal</div>
    <div class="field alt"><label for="p-nombre">Nombre</label><input id="p-nombre" type="text" placeholder="Tu nombre" value="Aiko" style="max-width:320px"></div>
    <div class="field alt"><label for="p-correo">Correo</label><input id="p-correo" type="text" placeholder="tu@correo.com" value="demo@petgo.com" style="max-width:320px"></div>
    <div class="field alt"><label for="p-tel">Teléfono</label><input id="p-tel" type="text" placeholder="+57 300 123 4567" value="+57 300 123 4567" style="max-width:320px"></div>
    <div class="field alt"><label for="p-ciudad">Ciudad</label><input id="p-ciudad" type="text" placeholder="Bogotá" value="Bogotá" style="max-width:320px"></div>
    <div class="acts"><button type="button" class="btn sec" id="edit-cancel">Cancelar</button><button type="button" class="btn" id="edit-save">Guardar cambios</button></div>
  </div>
  <button type="button" class="opt" id="edit-open"><span class="icon-box s">✏️</span><span class="lb">Editar perfil</span><span class="ch">›</span></button>
  <a class="opt" href="mis-mascotas.html"><span class="icon-box s">🐾</span><span class="lb">Mis mascotas</span><span class="ch">›</span></a>
  <a class="opt" href="notificaciones.html"><span class="icon-box s">🔔</span><span class="lb">Notificaciones</span><span class="ch">›</span></a>
  <a class="opt danger" href="index.html"><span class="icon-box s err">🚪</span><span class="lb">Cerrar sesión</span><span class="ch">›</span></a>
</div>
</main>

<script src="js/app.js"></script>
</body>
</html>
